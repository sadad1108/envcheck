<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>환경점검</title>
<meta name="theme-color" content="#12343F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="환경점검">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- 맑은 고딕이 없는 기기(휴대폰·맥)에서만 쓰이는 대체 글꼴 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한 화면 현황판: 짙은 상단 띠(이행률) → 위험 숫자 3개 → 부서 카드 격자 → 추이 · 미조치 목록 2단 */
:root{
  --bg:#EEF2F1; --card:#FFFFFF; --ink:#14201C; --muted:#5C6A65; --line:#DCE3E0;
  --band:#12343F; --band-ink:#EAF3F2; --band-muted:#9FC0C4; --accent:#3FA7B5;
  --ok:#2C7A4B; --ok-bg:#E1F1E7; --warn:#B7791F; --warn-bg:#FBEFD8; --bad:#BE3A2C; --bad-bg:#F9E0DC; --idle:#8A9692; --idle-bg:#EDF0EF;
  --font:"Malgun Gothic","맑은 고딕","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --mono:var(--font);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1513; --card:#17201D; --ink:#E3EBE8; --muted:#94A39E; --line:#27322F;
  --band:#0B2229; --band-ink:#E3F0EF; --band-muted:#7FA4A9; --accent:#4FB9C6;
  --ok:#5BC488; --ok-bg:#16301F; --warn:#E3AA4C; --warn-bg:#33270F; --bad:#F06E60; --bad-bg:#3A1A16; --idle:#7F8B87; --idle-bg:#1D2624; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 상단 띠 */
.band{background:var(--band);color:var(--band-ink);padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:64px}
.refresh{border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--band-ink);border-radius:999px;padding:9px 13px;font:inherit;font-size:.85rem;cursor:pointer}
.refresh:focus-visible{outline:2px solid var(--band-ink);outline-offset:3px}
.topbtns{display:flex;gap:8px;align-items:center}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-top:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--band-muted);font-weight:600}
h1{margin:2px 0 0;font-size:1.45rem;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.submit{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#06262C;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:999px;font-size:.92rem}
.submit:focus-visible{outline:2px solid var(--band-ink);outline-offset:3px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-top:22px}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:2rem;line-height:1;font-weight:600}
.ring b small{font-size:1rem;color:var(--band-muted);font-weight:500}
.ring span{font-size:.75rem;color:var(--band-muted);margin-top:4px}
.hero-txt p{margin:0;font-size:1.05rem;max-width:46ch}
.hero-txt p strong{color:#fff}
.todo{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.todo span{font-size:.8rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:3px 10px;border-radius:999px}
.meta{margin-top:10px;font-size:.78rem;color:var(--band-muted)}

/* 위험 숫자 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-40px}
.stat{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(10,30,30,.06);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:.8rem;color:var(--muted);font-weight:600}
.stat .v{font-size:2.2rem;font-weight:600;line-height:1.15}
.stat .s{font-size:.76rem;color:var(--muted)}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)}
.stat.zero .v{color:var(--ok)}

/* 섹션 */
section{margin-top:28px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
h2{margin:0;font-size:1.02rem;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* 부서 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.dept{background:var(--card);border-radius:12px;padding:13px 14px 12px;border:1px solid var(--line);border-top:4px solid var(--c);display:flex;flex-direction:column;gap:8px;min-width:0}
.dept .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:4px 8px}
.dept .n,.dept .o{word-break:keep-all}
body{word-break:keep-all}
.dept .n{font-weight:700;font-size:.98rem;line-height:1.3}
.dept .o{font-size:.74rem;color:var(--muted);margin-top:1px}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--cb);color:var(--c)}
.dept .nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted);align-items:center}
.dept .nums span{white-space:nowrap}
.dept .nums b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.dept .nums .hot{color:var(--bad)}
.dept .nums .mid{color:var(--warn)}
.dept .last{font-size:.74rem;color:var(--muted);margin-left:auto}
.s-bad{--c:var(--bad);--cb:var(--bad-bg)} .s-idle{--c:var(--idle);--cb:var(--idle-bg)}
.s-warn{--c:var(--warn);--cb:var(--warn-bg)} .s-ok{--c:var(--ok);--cb:var(--ok-bg)}

/* 하단 2단 */
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.trend svg{width:100%;height:auto;display:block}
.trend text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.trend .val{fill:var(--ink);font-weight:600}
.issues{list-style:none;margin:0;padding:0}
.issues li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.issues li:first-child{border-top:0;padding-top:2px}
.sym{width:28px;height:28px;border-radius:8px;display:grid;place-content:center;font-weight:700;font-size:.95rem;background:var(--cb);color:var(--c)}
.issues .a{font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.issues .d{font-size:.76rem;color:var(--muted)}
.finding .r{font-size:.7rem;font-weight:700;color:var(--bad);border:1px solid currentColor;border-radius:999px;padding:0 6px}
.issues .r{font-size:.7rem;font-weight:700;color:var(--bad);border:1px solid currentColor;border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
.issues .dt{font-size:.76rem;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);font-size:.9rem;padding:14px 0;text-align:center}
.more{font-size:.78rem;color:var(--muted);margin-top:8px}
/* 부서 카드 클릭 */
.dept{cursor:pointer;transition:transform .12s,box-shadow .12s}
.dept:hover{box-shadow:0 6px 18px rgba(10,30,30,.08);transform:translateY(-1px)}
.dept:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dept .go{font-size:.72rem;color:var(--muted)}
.issues li.click{cursor:pointer}
.issues li.click:hover .a{text-decoration:underline}

/* 상세 창 */
.sheet-bg{position:fixed;inset:0;background:rgba(8,20,20,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);border-top:5px solid var(--c);padding:16px 18px 12px}
.sheet-h .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-h h3{margin:0;font-size:1.2rem}
.sheet-h .o{font-size:.8rem;color:var(--muted)}
.x-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:36px;height:36px;font-size:1.1rem;cursor:pointer;flex:none}
.x-btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sum{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.84rem;color:var(--muted)}
.sum b{font-family:var(--mono);color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.82rem;cursor:pointer;font-family:var(--mono)}
.tab[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--ok)}
.tab .dot.warn{background:var(--warn)} .tab .dot.bad{background:var(--bad)}
.sheet-b{padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px}
.sheet-b h4{margin:0 0 8px;font-size:.86rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
.finding{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.finding .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.finding .t b{font-size:.95rem}
.finding .k{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.finding dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.86rem}
.finding dt{color:var(--muted);white-space:nowrap}
.finding dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.st{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px}
.st.open{background:var(--warn-bg);color:var(--warn)} .st.done{background:var(--ok-bg);color:var(--ok)}
.areas{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.areas .g{padding:6px 13px;font-size:.74rem;font-weight:700;color:var(--muted);background:var(--idle-bg)}
.areas .a-row{display:flex;justify-content:space-between;gap:10px;padding:8px 13px;border-top:1px solid var(--line);font-size:.88rem}
.areas .a-row .sv{font-weight:700;white-space:nowrap}
.sv.O{color:var(--ok)} .sv.T{color:var(--warn)} .sv.X{color:var(--bad)} .sv.NA{color:var(--idle);font-weight:500}
.nodata{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
body.lock{overflow:hidden}
@media (max-width:760px){
  .sheet-bg{align-items:flex-end}
  .sheet{height:88%;border-radius:16px 16px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.2)}
  .sheet-h{border-radius:16px 16px 0 0}
}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:slide .18s ease-out} @keyframes slide{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}} }

/* 점검 입력 · 조치 완료 */
button.submit{border:0;cursor:pointer;font:inherit;font-weight:700}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.small{padding:5px 11px;font-size:.82rem;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.primary{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.btn:disabled,button.submit:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,.sg:focus-visible,.submit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.insp{font-size:.84rem;color:var(--muted);margin-bottom:-6px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.thumb{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--muted);font:inherit;font-size:.72rem;border:0;background:none;padding:0;cursor:zoom-in;text-align:left}
.thumb img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--idle-bg)}
.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* 전체 화면 사진 보기 */
.lb{position:fixed;inset:0;z-index:90;background:#0B100F;color:#EEF4F3;display:flex;flex-direction:column}
.lb-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.lb-h .t{font-weight:700;font-size:1rem;word-break:keep-all}
.lb-h .s{font-size:.8rem;color:#9FB6B2}
.lb-x{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:1.1rem;cursor:pointer}
.lb-stage{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.lb-track{display:flex;height:100%;will-change:transform}
.lb-track.anim{transition:transform .25s ease}
.lb-slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;transform-origin:center center}
.lb-slide img.anim{transition:transform .2s ease}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.4rem;cursor:pointer}
.lb-prev{left:12px} .lb-next{right:12px}
.lb-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.lb-dots{display:flex;gap:6px;flex-wrap:wrap}
.lb-dot{border:1px solid rgba(255,255,255,.3);background:transparent;color:#DCEAE7;border-radius:999px;padding:5px 12px;font:inherit;font-size:.8rem;cursor:pointer}
.lb-dot[aria-pressed="true"]{background:#fff;color:#0B100F;border-color:#fff;font-weight:700}
.lb-dl{background:var(--accent);color:#06262C;text-decoration:none;font-weight:700;border-radius:999px;padding:9px 18px;font-size:.9rem}
.lb-hint{width:100%;font-size:.74rem;color:#7F9692}
.lb-x:focus-visible,.lb-nav:focus-visible,.lb-dot:focus-visible,.lb-dl:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700;min-width:0}
.fld input,.fld select,.fld textarea{font:inherit;font-weight:400;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chk{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.hint2{margin:0;font-size:.78rem;color:var(--muted)}
.ck-list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ck-row{padding:11px 13px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ck-row:first-child{border-top:0}
.ck-row.miss{background:var(--bad-bg)}
.ck-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.ck-name{font-weight:600;font-size:.93rem;flex:1 1 140px;min-width:0}
.seg{display:flex;gap:4px}
.sg{font:inherit;min-width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer}
.sg.NA{font-size:.74rem;min-width:58px;color:var(--muted)}
.sg[aria-pressed="true"].O{background:var(--ok);border-color:var(--ok);color:#fff}
.sg[aria-pressed="true"].T{background:var(--warn);border-color:var(--warn);color:#fff}
.sg[aria-pressed="true"].X{background:var(--bad);border-color:var(--bad);color:#fff}
.sg[aria-pressed="true"].NA{background:var(--idle);border-color:var(--idle);color:#fff}
.ck-det{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:8px;background:var(--cb)}
.pp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pp img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:.78rem;color:var(--muted);font-weight:700}
.ck-bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ck-hint{font-size:.84rem;color:var(--muted)} .ck-hint.err{color:var(--bad);font-weight:700}
.formlink{font-size:.8rem;color:var(--muted);text-align:center}
.dlg-bg{position:fixed;inset:0;background:rgba(8,20,20,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--bg);border-radius:14px;width:min(460px,100%);max-height:92%;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg-h{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:0}
.dlg-h h3{margin:0;font-size:1.05rem} .dlg-h .o{font-size:.8rem;color:var(--muted)}
.dlg-b{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:80;max-width:90%}
@media (max-width:420px){ .fields{grid-template-columns:1fr} }

footer{margin-block:26px 34px;font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between}

@media (max-width:760px){
  .two{grid-template-columns:1fr}
  .hero{grid-template-columns:auto 1fr;gap:16px;margin-top:16px}
  .ring{width:92px;height:92px}
  .ring b{font-size:1.5rem}
  .ring span{font-size:.68rem}
  .hero-txt p{font-size:.92rem}
  .band{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:56px}
  .stats{gap:8px}
  .stat{padding:12px 12px}
  .stat .v{font-size:1.7rem}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:1.25rem}
}
@media (max-width:340px){ .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){ .ring circle.fg{transition:stroke-dashoffset .8s ease-out} }
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="top">
      <div>

<script>
/* ▼ 여기에 Apps Script 웹 앱 주소(/exec 로 끝나는 주소)를 넣으세요 ▼ */
var API_URL = 'https://script.google.com/macros/s/AKfycbxdGWBYSUfFeRVdWB3HIlUoQEJE45Yommz9RHOnnpOPx7Rgre4S24IB3srVC_2XvE7xjQ/exec';
/* ▲ ------------------------------------------------------------ ▲ */
var DATA = {depts:[],trend:[],open:[],details:{}};

var STATE = {
  '조치 필요': {cls:'s-bad', rank:0},
  '점검 필요': {cls:'s-idle', rank:1, label:'미점검'},
  '주의': {cls:'s-warn', rank:2},
  '양호': {cls:'s-ok', rank:3}
};
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function md(s){ if(!s) return ''; var p=String(s).split('-'); return p.length===3 ? (+p[1])+'/'+(+p[2]) : s; }

function render(d){
  var depts = d.depts || [];
  var total = depts.length;
  var done = depts.filter(function(x){ return x.week==='완료'; }).length;
  var X=0,T=0,R=0; depts.forEach(function(x){ X+=x.x; T+=x.t; R+=x.rep; });

  $('range').textContent = '이번 주 ' + md(d.weekStart) + ' ~ ' + md(d.weekEnd);
  FORM_URL = (d.formUrl && /^https:\/\//.test(d.formUrl)) ? d.formUrl : '';

  var C = 326.7, pct = total ? done/total : 0;
  $('ringfg').setAttribute('stroke-dashoffset', String(C*(1-pct)));
  var rn = $('ringnum'); rn.textContent = String(done); var sm=el('small',null,'/'+total); rn.appendChild(sm);

  var notDone = depts.filter(function(x){ return x.week!=='완료'; });
  var hl = $('headline'); hl.textContent='';
  if (!total) hl.textContent = '부서 정보가 없습니다.';
  else if (!notDone.length) { hl.appendChild(document.createTextNode('이번 주 ')); hl.appendChild(el('strong',null,'모든 부서')); hl.appendChild(document.createTextNode('가 점검을 마쳤습니다.')); }
  else { hl.appendChild(document.createTextNode(total+'개 부서 중 ')); hl.appendChild(el('strong',null,done+'개')); hl.appendChild(document.createTextNode(' 부서가 이번 주 점검을 마쳤습니다. 아직 '+notDone.length+'개 부서가 남았습니다.')); }
  var todo=$('todo'); todo.textContent='';
  notDone.forEach(function(x){ todo.appendChild(el('span',null,x.name)); });
  $('meta').textContent = '마지막 갱신 ' + (d.updatedAt||'') + ' · 5분마다 자동으로 새로 고침';

  setStat('st-x', X, 'bad'); setStat('st-t', T, 'warn'); setStat('st-r', R, 'bad');

  var grid=$('grid'); grid.textContent='';
  depts.slice().sort(function(a,b){
    var ra=(STATE[a.state]||{rank:9}).rank, rb=(STATE[b.state]||{rank:9}).rank;
    return ra-rb || (b.x+b.t)-(a.x+a.t);
  }).forEach(function(x){
    var st = STATE[x.state] || {cls:'s-idle'};
    var c = el('div','dept '+st.cls);
    c.setAttribute('role','button'); c.tabIndex = 0;
    c.setAttribute('aria-label', x.name + ' 점검 내용 보기');
    c.addEventListener('click', function(){ openDept(x.name); });
    c.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDept(x.name); } });
    var row = el('div','row');
    var nm = el('div'); nm.appendChild(el('div','n',x.name)); nm.appendChild(el('div','o','책임자 '+x.owner));
    var latest = ((d.details||{})[x.name]||[])[0];
    if (latest && latest.inspector) nm.appendChild(el('div','o','점검자 '+latest.inspector));
    row.appendChild(nm); row.appendChild(el('span','pill', st.label || x.state || ''));
    c.appendChild(row);
    var nums = el('div','nums');
    nums.appendChild(numSpan('X', x.x, 'hot')); nums.appendChild(numSpan('△', x.t, 'mid'));
    if (x.rep) nums.appendChild(numSpan('반복', x.rep, 'hot'));
    nums.appendChild(el('span','last', x.last ? '최근 '+md(x.last) : '점검 기록 없음'));
    c.appendChild(nums);
    grid.appendChild(c);
  });

  drawTrend(d.trend||[], total);

  var open = d.open||[], ul=$('issues'); ul.textContent='';
  $('opencount').textContent = open.length ? open.length+'건' : '';
  if (!open.length) ul.appendChild(el('li','empty','미조치 지적사항이 없습니다.'));
  var show = open.slice().sort(function(a,b){
    var sa=a.status.charAt(0)==='X'?0:1, sb=b.status.charAt(0)==='X'?0:1;
    return sa-sb || (a.date<b.date?-1:1);
  }).slice(0,8);
  show.forEach(function(o){
    var isX = o.status.charAt(0)==='X';
    var li = el('li', (isX?'s-bad':'s-warn') + ' click');
    li.tabIndex = 0;
    li.addEventListener('click', function(){ openDept(o.dept, o.date); });
    li.addEventListener('keydown', function(e){ if(e.key==='Enter'){ openDept(o.dept, o.date); } });
    li.appendChild(el('span','sym', isX?'X':'△'));
    var mid = el('div');
    var a = el('div','a',o.area); if (o.rep) a.appendChild(el('span','r','반복'));
    mid.appendChild(a); mid.appendChild(el('div','d',o.dept + ' · ' + (isX?'중대미흡':'미흡')));
    li.appendChild(mid);
    li.appendChild(el('span','dt num', md(o.date)));
    ul.appendChild(li);
  });
  var more=$('more'); more.hidden = open.length<=8; more.textContent = '외 '+(open.length-8)+'건은 관리팀 시트에서 확인하세요.';
  $('foot').textContent = '갱신 ' + (d.updatedAt||'');
  DATA = d;
  if (OPEN.dept) renderDept();
}

/* ---------- 부서 상세 ---------- */
var OPEN = {dept:null, idx:0, lastFocus:null};
function symOf(s){ s=String(s||''); var c=s.charAt(0); return c==='X'?'X':c==='△'?'T':c==='○'?'O':'NA'; }
var SYM = {O:'○',T:'△',X:'X',NA:'–'};
var SNAME = {O:'양호',T:'미흡',X:'중대미흡',NA:'해당없음'};

function openDept(name, date){
  OPEN.lastFocus = document.activeElement;
  OPEN.dept = name; OPEN.idx = 0;
  var checks = (DATA.details||{})[name] || [];
  if (date) { for (var i=0;i<checks.length;i++){ if(checks[i].date===date){ OPEN.idx=i; break; } } }
  $('sheetbg').hidden = false; syncLock();
  renderDept();
  $('sh-close').focus();
}
function closeDept(){
  $('sheetbg').hidden = true;
  OPEN.dept = null; syncLock();
  if (OPEN.lastFocus && OPEN.lastFocus.focus) OPEN.lastFocus.focus();
}
function renderDept(){
  var name = OPEN.dept;
  var info = (DATA.depts||[]).filter(function(x){ return x.name===name; })[0] || {name:name, owner:'', state:''};
  var st = STATE[info.state] || {cls:'s-idle'};
  var checks = (DATA.details||{})[name] || [];
  if (OPEN.idx >= checks.length) OPEN.idx = 0;

  $('sheeth').className = 'sheet-h ' + st.cls;
  $('sh-title').textContent = info.name;
  $('sh-owner').textContent = '책임자 ' + (info.owner||'') + (info.state ? ' · ' + (st.label||info.state) : '');

  var sum = $('sh-sum'); sum.textContent='';
  [['이번 주', info.week||'-'], ['최근 점검', info.last?md(info.last):'없음'], ['미조치 X', String(info.x||0)], ['미조치 △', String(info.t||0)], ['반복', String(info.rep||0)]]
    .forEach(function(p){ var s=el('span',null,p[0]+' '); s.appendChild(el('b',null,p[1])); sum.appendChild(s); });

  var tabs = $('sh-tabs'); tabs.textContent='';
  checks.forEach(function(c,i){
    var bad = c.items.filter(function(it){ return symOf(it.status)==='X'; }).length;
    var mid = c.items.filter(function(it){ return symOf(it.status)==='T'; }).length;
    var b = el('button','tab', md(c.date)); b.type='button';
    b.setAttribute('aria-pressed', String(i===OPEN.idx));
    b.appendChild(el('span','dot'+(bad?' bad':mid?' warn':'')));
    b.addEventListener('click', function(){ OPEN.idx=i; renderDept(); });
    tabs.appendChild(b);
  });
  tabs.hidden = !checks.length;

  var body = $('sh-body'); body.textContent='';
  if (!checks.length){ body.appendChild(el('div','nodata','아직 점검 기록이 없습니다.')); return; }
  var c = checks[OPEN.idx];
  body.appendChild(el('div','insp', md(c.date) + ' 점검 · 점검자 ' + (c.inspector || '기록 없음')));

  var bads = c.items.filter(function(it){ var s=symOf(it.status); return s==='X'||s==='T'; })
    .sort(function(a,b){ return (symOf(a.status)==='X'?0:1)-(symOf(b.status)==='X'?0:1); });
  var sec1 = el('div'); sec1.appendChild(el('h4',null, md(c.date)+' 점검 지적 사항 ' + (bads.length? bads.length+'건':'')));
  if (!bads.length) sec1.appendChild(el('div','nodata','지적 사항 없이 모든 구역이 양호했습니다.'));
  bads.forEach(function(it){
    var s = symOf(it.status);
    var f = el('div','finding '+(s==='X'?'s-bad':'s-warn'));
    var t = el('div','t');
    t.appendChild(el('span','sym', SYM[s]));
    t.appendChild(el('b',null,it.area));
    if (it.kind && it.kind!=='담당 구역') t.appendChild(el('span','k',it.kind));
    if (it.rep) t.appendChild(el('span','r','반복'));
    t.appendChild(el('span','st '+(it.done?'done':'open'), it.done ? '조치 완료 '+md(it.done) : '미조치'));
    f.appendChild(t);
    var dl = el('dl');
    dl.appendChild(el('dt',null,'지적 내용')); dl.appendChild(el('dd',null,it.issue||'입력 없음'));
    dl.appendChild(el('dt',null,'조치 내용')); dl.appendChild(el('dd',null,it.action||'입력 없음'));
    f.appendChild(dl);
    if (it.photo || it.donePhoto) {
      var ph = el('div','photos');
      var plist = [];
      if (it.photo) plist.push({id:it.photo, label:'지적 사진'});
      if (it.donePhoto) plist.push({id:it.donePhoto, label:'조치 후 사진'});
      plist.forEach(function(p, i){ ph.appendChild(thumb(p.id, p.label, plist, i, it.area + ' · ' + md(c.date))); });
      f.appendChild(ph);
    }
    if (!it.done) {
      var rb = el('button','btn small','조치 완료 처리'); rb.type='button';
      (function(item, date){ rb.addEventListener('click', function(){ openResolve(name, date, item); }); })(it, c.date);
      f.appendChild(rb);
    }
    sec1.appendChild(f);
  });
  body.appendChild(sec1);

  var sec2 = el('div'); sec2.appendChild(el('h4',null,'구역별 점검 결과'));
  var box = el('div','areas'), lastKind=null;
  c.items.forEach(function(it){
    if (it.kind!==lastKind){ box.appendChild(el('div','g',it.kind||'구역')); lastKind=it.kind; }
    var s = symOf(it.status), r = el('div','a-row');
    r.appendChild(el('span',null,it.area));
    r.appendChild(el('span','sv '+s, SYM[s]+' '+SNAME[s]));
    box.appendChild(r);
  });
  sec2.appendChild(box);
  body.appendChild(sec2);
}
$('sh-close').addEventListener('click', closeDept);
$('sheetbg').addEventListener('click', function(e){ if(e.target===this) closeDept(); });
document.addEventListener('keydown', function(e){
  if (e.key!=='Escape') return;
  if (!$('lb').hidden) closeLightbox(); else if (!$('rsbg').hidden) closeResolve(); else if (!$('chkbg').hidden) closeCheck(); else if (OPEN.dept) closeDept();
});

/* ---------- 공통 도구 ---------- */
var FORM_URL = '';
var STAT_LIST = ['○ 양호','△ 미흡','X 중대미흡','해당없음'];
function syncLock(){ document.body.classList.toggle('lock', !$('sheetbg').hidden || !$('chkbg').hidden || !$('rsbg').hidden || !$('lb').hidden); }
function pad2(n){ return (n<10?'0':'')+n; }
function today(){ var t=new Date(); return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate()); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
var toastT; function toast(m){ var t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; },3200); }
function safeId(id){ return /^[-\w]+$/.test(String(id||'')) ? id : ''; }
function thumbUrl(id, w){ return 'https://drive.google.com/thumbnail?id='+safeId(id)+'&sz=w'+w; }
function thumb(id, label, list, idx, title){
  var b = el('button','thumb'); b.type='button'; b.setAttribute('aria-label', label+' 크게 보기');
  var img = el('img'); img.src=thumbUrl(id,400); img.alt=label; img.loading='lazy';
  b.appendChild(img); b.appendChild(el('span',null,label));
  b.addEventListener('click', function(){ openLightbox(list || [{id:id,label:label}], idx || 0, title || label); });
  return b;
}

/* ---------- 전체 화면 사진 보기: 확대(두 손가락·두 번 탭·휠), 옆으로 넘기기, 다운로드 ---------- */
var LB = {list:[], idx:0, title:'', s:1, x:0, y:0, ptrs:{}, g:null, lastTap:0, lastFocus:null};
function lbImg(){ return document.querySelectorAll('#lb-track img')[LB.idx]; }
function openLightbox(list, idx, title){
  LB.list = list.filter(function(p){ return safeId(p.id); }); if (!LB.list.length) return;
  LB.title = title; LB.lastFocus = document.activeElement;
  var tr = $('lb-track'); tr.textContent='';
  LB.list.forEach(function(p){
    var s=el('div','lb-slide'); var im=el('img'); im.alt=p.label; im.draggable=false;
    var sizes=[1600,1000,400], k=0;   // 드라이브가 큰 크기를 거절하면 작은 크기로 다시 시도
    im.onerror=function(){ k++; if (k<sizes.length) im.src=thumbUrl(p.id,sizes[k]); };
    im.src=thumbUrl(p.id,sizes[0]); s.appendChild(im); tr.appendChild(s);
  });
  var dots = $('lb-dots'); dots.textContent='';
  if (LB.list.length > 1) LB.list.forEach(function(p,i){ var d=el('button','lb-dot',p.label); d.type='button'; d.addEventListener('click',function(){ lbGo(i); }); dots.appendChild(d); });
  $('lb-prev').hidden = $('lb-next').hidden = LB.list.length < 2;
  $('lb-hint').textContent = (LB.list.length>1 ? '옆으로 밀면 다음 사진 · ' : '') + '두 손가락 또는 두 번 탭으로 확대';
  $('lb').hidden = false; syncLock();
  lbGo(Math.min(idx||0, LB.list.length-1), true);
  $('lb-close').focus();
}
function closeLightbox(){ $('lb').hidden = true; syncLock(); if (LB.lastFocus && LB.lastFocus.focus) LB.lastFocus.focus(); }
function lbApply(anim){ var im=lbImg(); if(!im) return; im.classList.toggle('anim', !!anim); im.style.transform = 'translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')'; }
function lbReset(anim){ LB.s=1; LB.x=0; LB.y=0; lbApply(anim); }
function lbGo(i, instant){
  var prev = lbImg(); if (prev) { prev.classList.remove('anim'); prev.style.transform=''; }
  LB.idx = Math.max(0, Math.min(LB.list.length-1, i)); LB.s=1; LB.x=0; LB.y=0;
  var tr = $('lb-track'); tr.classList.toggle('anim', !instant); tr.style.transform = 'translateX('+(-LB.idx*100)+'%)';
  var p = LB.list[LB.idx];
  $('lb-title').textContent = LB.title;
  $('lb-label').textContent = p.label + (LB.list.length>1 ? '  ' + (LB.idx+1) + ' / ' + LB.list.length : '');
  $('lb-dl').href = 'https://drive.google.com/uc?export=download&id=' + safeId(p.id);
  [].forEach.call(document.querySelectorAll('#lb-dots .lb-dot'), function(d,k){ d.setAttribute('aria-pressed', String(k===LB.idx)); });
  $('lb-prev').disabled = LB.idx===0; $('lb-next').disabled = LB.idx===LB.list.length-1;
}
function lbClampPan(){
  var st=$('lb-stage'), m=(LB.s-1)/2;
  LB.x = Math.max(-st.clientWidth*m, Math.min(st.clientWidth*m, LB.x));
  LB.y = Math.max(-st.clientHeight*m, Math.min(st.clientHeight*m, LB.y));
}
function lbZoomTo(s){ LB.s = Math.max(1, Math.min(5, s)); if (LB.s===1){ LB.x=0; LB.y=0; } lbClampPan(); }
(function(){
  var st = $('lb-stage');
  function pts(){ return Object.keys(LB.ptrs).map(function(k){ return LB.ptrs[k]; }); }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  st.addEventListener('pointerdown', function(e){
    try { st.setPointerCapture(e.pointerId); } catch (err) {}
    LB.ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
    var p = pts();
    if (p.length === 2) LB.g = {type:'pinch', d:dist(p[0],p[1]), s:LB.s};
    else if (p.length === 1) LB.g = {type: LB.s>1 ? 'pan' : 'swipe', sx:e.clientX, sy:e.clientY, x:LB.x, y:LB.y, t:Date.now(), moved:0};
  });
  st.addEventListener('pointermove', function(e){
    if (!LB.ptrs[e.pointerId] || !LB.g) return;
    LB.ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
    var p = pts(), g = LB.g;
    if (g.type === 'pinch' && p.length === 2){ lbZoomTo(g.s * dist(p[0],p[1]) / g.d); lbApply(false); return; }
    var dx = e.clientX - g.sx, dy = e.clientY - g.sy; g.moved = Math.max(g.moved, Math.abs(dx), Math.abs(dy));
    if (g.type === 'pan'){ LB.x = g.x + dx; LB.y = g.y + dy; lbClampPan(); lbApply(false); }
    else if (g.type === 'swipe'){ var tr=$('lb-track'); tr.classList.remove('anim'); tr.style.transform = 'translateX(calc('+(-LB.idx*100)+'% + '+dx+'px))'; }
  });
  function end(e){
    if (!LB.ptrs[e.pointerId]) return;
    delete LB.ptrs[e.pointerId];
    var g = LB.g, left = pts().length;
    if (g && g.type === 'pinch'){ if (left === 1){ var q=pts()[0]; LB.g = {type: LB.s>1?'pan':'swipe', sx:q.x, sy:q.y, x:LB.x, y:LB.y, t:Date.now(), moved:99}; } else LB.g=null; if (LB.s<1.05) lbReset(true); return; }
    LB.g = null;
    if (!g || left) return;
    var dx = e.clientX - g.sx;
    if (g.type === 'swipe'){
      if (dx < -60 && LB.idx < LB.list.length-1) lbGo(LB.idx+1);
      else if (dx > 60 && LB.idx > 0) lbGo(LB.idx-1);
      else lbGo(LB.idx);
    }
    if (g.moved < 10 && Date.now() - g.t < 300){   // 탭
      var now = Date.now();
      if (now - LB.lastTap < 320){ if (LB.s > 1) lbReset(true); else { lbZoomTo(2.5); lbApply(true); } LB.lastTap = 0; }
      else LB.lastTap = now;
    }
  }
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  st.addEventListener('wheel', function(e){ e.preventDefault(); lbZoomTo(LB.s * (e.deltaY < 0 ? 1.15 : 0.87)); lbApply(false); }, {passive:false});
  $('lb-close').addEventListener('click', closeLightbox);
  $('lb-prev').addEventListener('click', function(){ lbGo(LB.idx-1); });
  $('lb-next').addEventListener('click', function(){ lbGo(LB.idx+1); });
  document.addEventListener('keydown', function(e){
    if ($('lb').hidden) return;
    if (e.key === 'ArrowLeft') lbGo(LB.idx-1); else if (e.key === 'ArrowRight') lbGo(LB.idx+1);
  });
})();
function field(label, input){ var l=el('label','fld'); l.appendChild(document.createTextNode(label)); l.appendChild(input); return l; }
function inputEl(type, val, on){ var i=el('input'); i.type=type; i.value=val||''; i.addEventListener('input',function(){ on(i.value); }); return i; }
function taField(label, val, ph, on){ var t=el('textarea'); t.value=val||''; t.placeholder=ph||''; t.addEventListener('input',function(){ on(t.value); }); return field(label,t); }
function remember(checked, on){ var l=el('label','chk'); var c=el('input'); c.type='checkbox'; c.checked=!!checked; c.addEventListener('change',function(){ on(c.checked); }); l.appendChild(c); l.appendChild(document.createTextNode('이 기기에서 기억하기')); return l; }
function shrink(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var max=1280, sc=Math.min(1, max/Math.max(img.width,img.height));
      var c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      var du=c.toDataURL('image/jpeg',0.8); res({data:du.split(',')[1], mime:'image/jpeg', preview:du});
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없습니다. 다른 사진을 골라 주세요.')); };
    img.src = url;
  });
}
function photoPick(obj, label, rerender){
  var w=el('div'); w.appendChild(el('div','lbl',label));
  var row=el('div','pp');
  if (obj.photo && obj.photo.preview){ var im=el('img'); im.src=obj.photo.preview; im.alt=label; row.appendChild(im); }
  // 최근 안드로이드의 사진 선택기에는 카메라가 없어서, 촬영(capture)과 앨범을 따로 둠
  function picker(text, useCamera){
    var inp=el('input'); inp.type='file'; inp.accept='image/*'; inp.hidden=true;
    if (useCamera) inp.setAttribute('capture','environment');
    var bt=el('button','btn small', text); bt.type='button';
    bt.addEventListener('click',function(){ inp.value=''; inp.click(); });
    inp.addEventListener('change',function(){
      var f=inp.files[0]; if(!f) return; bt.disabled=true; bt.textContent='사진 준비 중…';
      shrink(f).then(function(p){ obj.photo=p; rerender(); }).catch(function(e){ toast(e.message); bt.disabled=false; bt.textContent=text; });
    });
    row.appendChild(inp); row.appendChild(bt);
  }
  picker(obj.photo ? '다시 촬영' : '사진 촬영', true);
  picker('앨범에서 선택', false);
  if (obj.photo){ var rm=el('button','btn small ghost','삭제'); rm.type='button'; rm.addEventListener('click',function(){ obj.photo=null; rerender(); }); row.appendChild(rm); }
  w.appendChild(row); return w;
}
function post(body){
  return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error('서버 응답 오류 ('+r.status+')'); return r.json(); })
    .then(function(j){ if(!j || !j.ok) throw new Error((j && j.error) || '처리하지 못했습니다.'); return j; });
}
function isBadS(s){ return /^(X|△)/.test(String(s||'')); }

/* ---------- 점검 입력 ---------- */
var CK = null;
function ckKey(x){ return x.kind+'|'+x.area; }
function openCheck(){
  if (!DATA.areas || !Object.keys(DATA.areas).length){ toast('부서 정보를 불러오는 중입니다. 잠시 후 다시 눌러 주세요.'); load(); return; }
  var dept = lsGet('envcheck.dept'); if (!DATA.areas[dept]) dept = Object.keys(DATA.areas)[0];
  CK = {dept:dept, date:today(), inspector:lsGet('envcheck.inspector')||'', pin:lsGet('envcheck.pin.'+dept)||'', remember:!!lsGet('envcheck.pin.'+dept), items:{}, tried:false, busy:false};
  $('chkbg').hidden=false; syncLock(); renderCheck();
  var s=document.querySelector('#chkbg .sheet'); if(s) s.scrollTop=0;
}
function closeCheck(){ $('chkbg').hidden=true; CK=null; syncLock(); }
function renderCheck(){
  var b=$('ck-body'); b.textContent='';
  var f=el('div','fields');
  var sel=el('select'); Object.keys(DATA.areas).forEach(function(n){ var o=el('option',null,n); o.value=n; sel.appendChild(o); }); sel.value=CK.dept;
  sel.addEventListener('change',function(){
    if (Object.keys(CK.items).length && !window.confirm('부서를 바꾸면 지금까지 고른 내용이 지워집니다. 바꿀까요?')){ sel.value=CK.dept; return; }
    CK.dept=sel.value; CK.items={}; CK.tried=false; CK.pin=lsGet('envcheck.pin.'+CK.dept)||''; CK.remember=!!lsGet('envcheck.pin.'+CK.dept); renderCheck();
  });
  f.appendChild(field('부서', sel));
  f.appendChild(field('점검일', inputEl('date', CK.date, function(v){ CK.date=v; })));
  f.appendChild(field('점검자 (이름 직급)', inputEl('text', CK.inspector, function(v){ CK.inspector=v; })));
  var pin=inputEl('password', CK.pin, function(v){ CK.pin=v; }); pin.inputMode='numeric'; pin.maxLength=8; pin.autocomplete='off';
  f.appendChild(field('부서 PIN', pin));
  b.appendChild(f);
  b.appendChild(remember(CK.remember, function(v){ CK.remember=v; }));
  b.appendChild(el('p','hint2','판단 기준: 바닥·작업대 청결 · 통로와 비상구 앞 적치물 · 자재·공구 정위치 보관 · 쓰레기 분리배출 · 담당 구역 표시 상태'));
  var last=null, box=null;
  (DATA.areas[CK.dept]||[]).forEach(function(x){
    if (x.kind!==last){ b.appendChild(el('h4',null,x.kind)); box=el('div','ck-list'); b.appendChild(box); last=x.kind; }
    box.appendChild(ckRow(x));
  });
  var bar=el('div','ck-bar'); var hint=el('span','ck-hint'); hint.id='ck-hint'; bar.appendChild(hint);
  var sb=el('button','submit','제출하기'); sb.type='button'; sb.id='ck-send'; sb.addEventListener('click', sendCheck); bar.appendChild(sb);
  b.appendChild(bar);
  if (FORM_URL){ var fl=el('a','formlink','앱 입력이 안 될 때는 구글 폼으로 제출하기'); fl.href=FORM_URL; fl.target='_blank'; fl.rel='noopener'; b.appendChild(fl); }
  updHint();
}
function ckRow(x){
  var it=CK.items[ckKey(x)]||{};
  var bad=isBadS(it.status);
  var row=el('div','ck-row'+(CK.tried && (!it.status || (bad && !(it.issue||'').trim())) ? ' miss':''));
  var top=el('div','ck-top'); top.appendChild(el('div','ck-name',x.area));
  var seg=el('div','seg');
  STAT_LIST.forEach(function(s){
    var c=symOf(s), bt=el('button','sg '+c, c==='NA'?'해당없음':SYM[c]); bt.type='button';
    bt.setAttribute('aria-pressed', String(it.status===s)); bt.setAttribute('aria-label', x.area+' '+s);
    bt.addEventListener('click',function(){ var cur=CK.items[ckKey(x)]||{}; cur.status = cur.status===s ? undefined : s; CK.items[ckKey(x)]=cur; row.replaceWith(ckRow(x)); updHint(); });
    seg.appendChild(bt);
  });
  top.appendChild(seg); row.appendChild(top);
  if (bad){
    var det=el('div','ck-det '+(symOf(it.status)==='X'?'s-bad':'s-warn'));
    det.appendChild(taField('지적 내용 (필수)', it.issue, '예: 통로에 팔레트 3개 적치', function(v){ it.issue=v; updHint(); }));
    det.appendChild(taField('조치 내용 또는 계획', it.action, '예: 당일 오후 적재장소로 이동', function(v){ it.action=v; }));
    det.appendChild(photoPick(it, '현장 사진 (선택)', function(){ row.replaceWith(ckRow(x)); }));
    row.appendChild(det);
  }
  return row;
}
function ckMissing(){
  return (DATA.areas[CK.dept]||[]).filter(function(x){ var it=CK.items[ckKey(x)]; return !it || !it.status || (isBadS(it.status) && !(it.issue||'').trim()); });
}
function updHint(){
  var h=$('ck-hint'); if(!h) return;
  var all=(DATA.areas[CK.dept]||[]).length, miss=ckMissing().length;
  h.className='ck-hint'; h.textContent=(all-miss)+' / '+all+' 구역 입력';
}
function sendCheck(){
  if (CK.busy) return;
  CK.tried=true;
  var miss=ckMissing(), need=[];
  if (!CK.date) need.push('점검일'); if (!CK.inspector.trim()) need.push('점검자'); if (!CK.pin.trim()) need.push('부서 PIN');
  if (miss.length || need.length){
    renderCheck();
    var m=[]; if (need.length) m.push(need.join(', ')+'을 입력해 주세요'); if (miss.length) m.push(miss.length+'개 구역을 확인해 주세요');
    var h=$('ck-hint'); h.textContent=m.join(' · '); h.className='ck-hint err';
    var first=document.querySelector('.ck-row.miss'); if (first) first.scrollIntoView({block:'center'});
    return;
  }
  var payload={action:'submit', dept:CK.dept, date:CK.date, inspector:CK.inspector.trim(), pin:CK.pin.trim(),
    items:(DATA.areas[CK.dept]||[]).map(function(x){ var it=CK.items[ckKey(x)]; return {kind:x.kind, area:x.area, status:it.status, issue:it.issue||'', action:it.action||'', photo: it.photo ? {data:it.photo.data, mime:it.photo.mime} : null}; })};
  CK.busy=true; var sb=$('ck-send'); sb.disabled=true; sb.textContent='보내는 중…';
  post(payload).then(function(){
    lsSet('envcheck.dept', CK.dept); lsSet('envcheck.inspector', CK.inspector.trim()); lsSet('envcheck.pin.'+CK.dept, CK.remember ? CK.pin.trim() : null);
    var dn=CK.dept; closeCheck(); toast(dn+' 점검을 제출했습니다'); load();
  }).catch(function(e){
    CK.busy=false; sb.disabled=false; sb.textContent='제출하기';
    var h=$('ck-hint'); h.textContent=e.message; h.className='ck-hint err';
  });
}
$('submit').addEventListener('click', openCheck);
$('ck-close').addEventListener('click', function(){ if (CK && Object.keys(CK.items).length && !window.confirm('입력한 내용을 버리고 닫을까요?')) return; closeCheck(); });

/* ---------- 조치 완료 처리 ---------- */
var RS = null;
function openResolve(dept, date, item){
  RS={dept:dept, date:date, kind:item.kind, area:item.area, actionText:item.action||'', done:today(), pw:lsGet('envcheck.admin')||'', remember:!!lsGet('envcheck.admin'), photo:null, busy:false};
  $('rsbg').hidden=false; syncLock(); renderResolve();
}
function closeResolve(){ $('rsbg').hidden=true; RS=null; syncLock(); }
function renderResolve(){
  var b=$('rs-body'); b.textContent='';
  $('rs-title').textContent='조치 완료 처리 · '+RS.area;
  $('rs-sub').textContent=RS.dept+' · '+md(RS.date)+' 점검 지적';
  b.appendChild(taField('조치 내용 (필수)', RS.actionText, '예: 팔레트 적재장소로 이동, 바닥 청소 완료', function(v){ RS.actionText=v; }));
  b.appendChild(field('조치 완료일', inputEl('date', RS.done, function(v){ RS.done=v; })));
  b.appendChild(photoPick(RS, '조치 후 사진 (선택)', renderResolve));
  var pw=inputEl('password', RS.pw, function(v){ RS.pw=v; }); pw.autocomplete='off';
  b.appendChild(field('관리자 비밀번호', pw));
  b.appendChild(remember(RS.remember, function(v){ RS.remember=v; }));
  var act=el('div','dlg-actions'); var hint=el('span','ck-hint'); hint.id='rs-hint'; act.appendChild(hint);
  var cancel=el('button','btn','취소'); cancel.type='button'; cancel.addEventListener('click', closeResolve);
  var ok=el('button','btn primary','조치 완료로 저장'); ok.type='button'; ok.id='rs-send'; ok.addEventListener('click', sendResolve);

function sendResolve(){
  if (RS.busy) return;
  var h=$('rs-hint');
  if (!RS.actionText.trim() || !RS.done || !RS.pw.trim()){ h.textContent='조치 내용, 완료일, 관리자 비밀번호를 입력해 주세요'; h.className='ck-hint err'; return; }
  RS.busy=true; var ok=$('rs-send'); ok.disabled=true; ok.textContent='저장 중…';
  post({action:'resolve', dept:RS.dept, date:RS.date, kind:RS.kind, area:RS.area, actionText:RS.actionText.trim(), done:RS.done, pw:RS.pw.trim(), photo: RS.photo ? {data:RS.photo.data, mime:RS.photo.mime} : null})
    .then(function(){ lsSet('envcheck.admin', RS.remember ? RS.pw.trim() : null); var a=RS.area; closeResolve(); toast(a+' 조치 완료로 저장했습니다'); load(); })
    .catch(function(e){ RS.busy=false; ok.disabled=false; ok.textContent='조치 완료로 저장'; h.textContent=e.message; h.className='ck-hint err'; });
}
$('rs-close').addEventListener('click', closeResolve);
$('rsbg').addEventListener('click', function(e){ if (e.target===this) closeResolve(); });
function setStat(id, v, tone){
  var s=$(id); s.className='stat '+(v>0?tone:'zero'); s.querySelector('.v').textContent=String(v);
}
function numSpan(label, v, hotCls){
  var s=el('span'); s.appendChild(document.createTextNode(label+' '));
  var b=el('b',v>0?hotCls:null,String(v)); s.appendChild(b); return s;

function drawTrend(rows, total){
  var box=$('trend'); box.textContent='';
  if (!rows.length){ box.appendChild(el('div','empty','기록이 없습니다.')); return; }
  var W=340,H=150,pl=8,pr=8,pt=18,pb=22, n=rows.length;
  var max=Math.max(total||0, rows.reduce(function(m,r){return Math.max(m,r.count);},0), 1);
  var bw=(W-pl-pr)/n, NS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('role','img');
  svg.setAttribute('aria-label','최근 8주 주차별 점검 부서 수');
  function mk(t,a){ var e=document.createElementNS(NS,t); for(var k in a) e.setAttribute(k,a[k]); return e; }
  var yTop = pt, yBase = H-pb;
  svg.appendChild(mk('line',{x1:pl,x2:W-pr,y1:yTop,y2:yTop,stroke:'var(--line)','stroke-dasharray':'3 3'}));
  var tl=mk('text',{x:W-pr,y:yTop-5,'text-anchor':'end'}); tl.textContent='전체 '+max; svg.appendChild(tl);
  svg.appendChild(mk('line',{x1:pl,x2:W-pr,y1:yBase,y2:yBase,stroke:'var(--line)'}));
  rows.forEach(function(r,i){
    var h=(yBase-yTop)*(r.count/max), x=pl+i*bw+bw*0.2, w=bw*0.6, last=i===n-1;
    svg.appendChild(mk('rect',{x:x,y:yBase-h,width:w,height:Math.max(h,0),rx:4,fill:last?'var(--accent)':'var(--idle)',opacity:last?1:.45}));
    var v=mk('text',{x:x+w/2,y:yBase-h-4,'text-anchor':'middle','class':'val'}); v.textContent=String(r.count); svg.appendChild(v);
    var lb=mk('text',{x:x+w/2,y:H-7,'text-anchor':'middle'}); lb.textContent=r.week; svg.appendChild(lb);
  });
  box.appendChild(svg);
}

/* ---------- 데이터 받아오기 ---------- */
var CACHE_KEY = 'envcheck.data';
function showErr(msg){ var e=$('err'); e.hidden=!msg; e.textContent=msg||''; }
function load(){
  if (API_URL.indexOf('여기에_배포_ID') !== -1) { showErr('앱 설정이 끝나지 않았습니다. index.html 의 API_URL 에 웹 앱 주소를 넣어 주세요.'); return; }
  $('refresh').disabled = true;
  fetch(API_URL + (API_URL.indexOf('?')>-1?'&':'?') + 'format=json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ if(!d || !d.depts) throw new Error('형식 오류'); render(d); showErr(''); try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch(e){} })
    .catch(function(){ showErr('최신 현황을 불러오지 못했습니다. 인터넷 연결을 확인하고 ↻ 버튼을 눌러 주세요.' + (DATA.updatedAt ? ' (화면은 '+DATA.updatedAt+' 기준)' : '')); })
    .then(function(){ $('refresh').disabled = false; });
}
try { var c = localStorage.getItem(CACHE_KEY); if (c) render(JSON.parse(c)); } catch(e) {}
if (!DATA.depts.length) { render(DATA); $('headline').textContent = '현황을 불러오는 중입니다…'; }
$('refresh').addEventListener('click', load);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState==='visible') load(); });
setInterval(load, 5*60*1000);
load();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
